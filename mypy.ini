# Static types for FamiDrive's Python tools, checked in `nix flake check`
# (tests/default.nix, the "types" check). Strict: every function is
# annotated, and nothing is Any by accident.
[mypy]
python_version = 3.13
strict = True
warn_unreachable = True
# Each tool is one script, run on its own: no package to import from.
explicit_package_bases = True
# evdev (1.9.3) has types, but leaves a few methods it calls all the time
# without them (syn, write, close).
untyped_calls_exclude = evdev

# Libraries with no types of their own (and no stubs in nixpkgs): what
# comes from them is Any, and the code around them says what it expects.
[mypy-jeepney.*,Xlib.*]
ignore_missing_imports = True

# dbus_next has types, but names its classes from its package's
# __init__ without saying they're exported.
[mypy-dbus_next.*]
implicit_reexport = True
